name: 功能建议
description: 提议一项新能力或参数调整
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说现状的不足，再说方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议
      description: 如果涉及动力学改动，说明会影响哪些不变量。注意情绪不应影响任务执行、工具调用、事实正确性和安全判断。
    validations:
      required: true
