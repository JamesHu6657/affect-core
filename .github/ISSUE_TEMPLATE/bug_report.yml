name: Bug 报告
description: 报告一个缺陷或不符合预期的情感行为
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 安全问题请勿走公开 issue，用 [私密报告通道](https://github.com/JamesHu6657/affect-core/security/advisories/new)。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为和你预期的行为。
      placeholder: 连续触发 5 次 praise 后 mood 完全没动。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 触发的事件序列，或一段最小测试代码。情感行为类问题请附上 `/mood` 输出。
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 配置
      description: 相关的 affect 配置片段，去掉密钥和私有路径。
      render: json

  - type: input
    id: versions
    attributes:
      label: 版本
      placeholder: affect-core main@abc1234 / OpenClaw 2026.7.1 / Node 22.14 / Ubuntu 24.04
    validations:
      required: true
